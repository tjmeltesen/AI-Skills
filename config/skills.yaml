# Repository-owned configuration, consumed by scripts/bootstrap.py.
# Hosts do not interpret this file directly.
version: 1
agents:
  - claude-code
  - codex
  - gemini-cli
  - cursor
installations:
  - name: ai-skills
    source: .
    skills: ['*']
    agents: [claude-code, codex, gemini-cli, cursor]
  - name: pstack-portable
    source: https://github.com/cursor/plugins/tree/main/pstack
    skills: ['*']
    agents: [claude-code, codex, gemini-cli]
    # Cursor uses its native plugin, enabled in .cursor/settings.json.
startup:
  skill: core/session-start/SKILL.md
  always_read:
    - core/ponytail/SKILL.md
    - core/design_rules/design-guidelines/SKILL.md
